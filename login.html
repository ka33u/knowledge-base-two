<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>登录｜HD MOTORS 设计知识库</title>
  <style>
    *{box-sizing:border-box} body{margin:0;background:#f3f5f2;color:#26342f;font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}.auth-page{min-height:100vh;display:grid;grid-template-columns:minmax(440px,1.08fr) minmax(420px,.92fr)}.visual{position:relative;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;padding:54px clamp(44px,7vw,112px);background:linear-gradient(145deg,#173c36 0%,#214c43 58%,#a85634 180%);color:#fff}.visual:before{content:"";position:absolute;width:560px;height:560px;right:-215px;top:15%;border:1px solid #ffffff18;border-radius:50%;box-shadow:0 0 0 75px #ffffff08,0 0 0 150px #ffffff05}.visual:after{content:"MOTOR / DESIGN / KNOWLEDGE";position:absolute;right:-154px;bottom:130px;color:#ffffff08;font:700 60px/1 ui-monospace,monospace;letter-spacing:.08em;transform:rotate(-90deg);white-space:nowrap}.brand,.intro,.points{position:relative;z-index:1}.brand{display:flex;align-items:center;gap:13px}.mark{display:grid;place-items:center;width:43px;height:43px;border:1px solid #b7cbc2;border-radius:50%;font:700 12px ui-monospace,monospace}.brand b{display:block;font-size:16px;letter-spacing:.1em}.brand small{display:block;margin-top:4px;color:#b9cbc4;font-size:11px;letter-spacing:.06em}.intro{margin:auto 0}.eyebrow{color:#e09a6b;font:700 10px ui-monospace,monospace;letter-spacing:.18em}.intro h1{max-width:470px;margin:15px 0 17px;font:700 clamp(34px,4vw,56px)/1.25 Georgia,"Noto Serif SC",serif;letter-spacing:-.045em}.intro p{max-width:440px;margin:0;color:#c4d3cd;font-size:14px;line-height:1.85}.points{display:flex;gap:28px;flex-wrap:wrap;color:#a6bdb4;font:10px ui-monospace,monospace;letter-spacing:.08em}.panel{display:flex;align-items:center;justify-content:center;padding:44px}.card{width:min(420px,100%)}.card .eyebrow{color:#b15f38}.card h2{margin:7px 0 8px;font:700 30px/1.3 Georgia,"Noto Serif SC",serif}.hint{margin:0 0 29px;color:#74827c;font-size:12px;line-height:1.8}.field{display:block;margin:0 0 16px;color:#526059;font-size:11px;font-weight:600}.field input{display:block;width:100%;min-height:46px;margin-top:7px;padding:10px 12px;border:1px solid #d8dfda;border-radius:7px;outline:0;color:#26342f;font:14px inherit;transition:border-color .16s,box-shadow .16s}.field input:focus{border-color:#b96735;box-shadow:0 0 0 3px #b967351c}.password{position:relative}.password input{padding-right:52px}.toggle{position:absolute;right:8px;bottom:7px;min-height:31px;padding:0 9px;border:0;border-radius:5px;background:transparent;color:#75827c;font-size:11px;cursor:pointer}.toggle:hover{background:#eef2ef;color:#263d35}.submit{width:100%;min-height:46px;margin-top:5px;border:0;border-radius:7px;background:#214c43;color:white;font:600 14px inherit;cursor:pointer;transition:background .16s,transform .16s}.submit:hover{background:#173c36}.submit:active{transform:translateY(1px)}.submit:disabled{cursor:wait;opacity:.7}.error{min-height:18px;margin:2px 0 10px;color:#a74943;font-size:12px}.security{display:block;margin-top:18px;color:#8a9691;font-size:10px;line-height:1.75}@media(max-width:780px){.auth-page{grid-template-columns:1fr}.visual{min-height:285px;padding:32px}.intro{margin:48px 0 0}.intro h1{margin:10px 0;font-size:31px}.intro p,.points{display:none}.visual:after{display:none}.panel{padding:38px 28px}.card{max-width:460px}}@media(max-width:420px){.visual{padding:28px 24px}.panel{padding:32px 22px}.intro h1{font-size:28px}}
  </style>
</head>
<body>
  <main class="auth-page">
    <section class="visual"><div class="brand"><span class="mark">HD</span><span><b>HD MOTORS</b><small>设计知识库</small></span></div><div class="intro"><span class="eyebrow">2026 DESIGN KNOWLEDGE</span><h1>让每一份设计资料<br>都有序、可查、可传承。</h1><p>把国家标准、行业标准、设计手册与企业经验沉淀为团队可持续使用的设计资产。</p></div><div class="points"><span>01 独立账号</span><span>02 服务端权限</span><span>03 局域网同步</span></div></section>
    <section class="panel"><form id="loginForm" class="card"><span class="eyebrow">SECURE ACCESS</span><h2 id="title">登录知识库</h2><p id="hint" class="hint">请输入本人账号和登录密码。</p><label class="field">登录账号<input id="username" required minlength="3" maxlength="32" autocomplete="username" placeholder="例如：zhangyu" autofocus></label><label class="field password">登录密码<input id="password" type="password" required minlength="6" maxlength="128" autocomplete="current-password" placeholder="请输入登录密码"><button id="togglePassword" type="button" class="toggle" aria-label="显示密码">显示</button></label><p id="error" class="error" role="status" aria-live="polite"></p><button id="submit" class="submit" type="submit">登录</button><small class="security">账号和密码仅用于本局域网身份验证；如遗忘密码，请联系系统管理员重置。</small></form></section>
  </main>
  <script>
    const $=selector=>document.querySelector(selector), next=new URLSearchParams(location.search).get('next');
    const destination=next&&next.startsWith('/')&&!next.startsWith('//')?next:'/'; let bootstrap=false;
    fetch('/api/auth/me',{credentials:'same-origin'}).then(response=>response.json()).then(data=>{if(data.user)return location.replace(destination);bootstrap=Boolean(data.bootstrapRequired);if(bootstrap){$('#title').textContent='初始化管理员';$('#hint').textContent='首次使用，请创建局域网管理员账号。密码至少 6 位。';$('#submit').textContent='创建管理员并登录';}}).catch(()=>{$('#error').textContent='无法连接服务器，请检查局域网连接。'});
    $('#togglePassword').onclick=()=>{const visible=$('#password').type==='text';$('#password').type=visible?'password':'text';$('#togglePassword').textContent=visible?'显示':'隐藏';$('#togglePassword').setAttribute('aria-label',visible?'显示密码':'隐藏密码');};
    $('#loginForm').addEventListener('submit',async event=>{event.preventDefault();const button=$('#submit'),error=$('#error'),original=button.textContent;error.textContent='';button.disabled=true;button.textContent='正在验证…';try{const response=await fetch(bootstrap?'/api/auth/bootstrap':'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({username:$('#username').value.trim(),password:$('#password').value})});const data=await response.json();if(!response.ok)throw new Error(data.error||'登录失败');location.replace(destination)}catch(reason){error.textContent=reason.message||'登录失败，请重试。';button.disabled=false;button.textContent=original}});
  </script>
</body>
</html>
